<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8b1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CrimSound">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CrimSound</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--accent:#8b1a1a;--accent-text:#fff;--line:#e3e1db;--danger:#c93a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--card:#222226;--text:#f1f0ec;--muted:#9a9a94;--accent:#b02a2a;--accent-text:#fff;--line:#34343a;--danger:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161618;--card:#222226;--text:#f1f0ec;--muted:#9a9a94;--accent:#b02a2a;--accent-text:#fff;--line:#34343a;--danger:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:190px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:32px;font-weight:500;letter-spacing:.3px;margin:0 0 14px}
h1 b{font-weight:800;color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.up{padding:14px 26px;font-size:17px;margin-bottom:12px}
.status{font-size:14px;color:var(--muted);margin:0 0 10px;min-height:20px}
.status.err{color:var(--danger)}
.note{font-size:13px;color:var(--muted);margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row.on{border-color:var(--accent)}
.row .ic{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.row .tt{flex:1;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sz{font-size:12px;color:var(--muted)}
.row .del{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}
.bar .now{cursor:pointer}
.fsx,.cover{display:none}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{display:none!important}
.cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--accent)}
.cover .ph svg{width:46%;height:46%}
.bar.full{top:0;display:flex;border-top:0;background:var(--bg);overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.bar.full .in{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.bar.full .fsx{display:flex;align-items:center;justify-content:center;align-self:flex-start;width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-text);padding:0;cursor:pointer}
.bar.full .cover{display:block;position:relative;width:min(100%,52vh);aspect-ratio:1;margin:6px auto 12px;border-radius:0;overflow:hidden;background:transparent}
.bar.full .now{font-size:22px;text-align:center;white-space:normal;margin-bottom:16px;cursor:default}
.bar.full .ctl{margin-top:18px;gap:14px}
.bar.full .ctl .pp{width:68px;height:68px}
.cover{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cover img{pointer-events:none}
.bar.full .cover.cc{border-radius:6%}
.stack{display:flex;flex-direction:column;gap:10px}
.btn.ghost.dt{color:var(--danger);border-color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;display:none;max-width:90%;text-align:center}
.toast.show{display:block}
div.cf{display:flex;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s}
div.cf.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease,visibility 0s}
div.cf .box{transform:translateY(28px) scale(.96);transition:transform .3s cubic-bezier(.22,.8,.3,1)}
div.cf.show .box{transform:none}
@media (prefers-reduced-motion:reduce){div.cf,div.cf.show,div.cf .box{transition-duration:.01s}}
.eq{display:none}
.bar.full .eq{display:block;width:100%;height:clamp(32px,6vh,50px);margin:0 0 clamp(10px,2vh,16px)}
.fslogo{display:none}
.bar.full .in{position:relative}
.bar.full .fslogo{display:flex;position:absolute;top:-8px;left:0;right:0;height:44px;align-items:center;justify-content:center;pointer-events:none;font-size:30px;font-weight:500;letter-spacing:.3px}
.fslogo b{font-weight:800;color:var(--accent)}
.bar.full{padding-top:calc(60px + env(safe-area-inset-top,0px))}
.bar.full .in{position:static}
.bar.full .fsx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4px);left:20px;z-index:2}
.bar.full .fslogo{top:calc(env(safe-area-inset-top,0px) + 4px)}
.cf .box.stbox{max-width:380px;max-height:86vh;overflow-y:auto;text-align:left}
.cf .box.stbox>p{text-align:center}
.sh{font-size:15px;font-weight:700;margin:0 0 12px}
.swg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:4px 4px 18px}
.sw{aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--text)}
.pal{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pv{width:44px;height:44px;border-radius:12px;border:1px solid var(--line)}
.hx{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.rl{display:flex;align-items:center;gap:10px;margin:2px 0}
.rl span{width:14px;font-weight:700;font-size:14px}
.rl input{flex:1;min-width:0}
#cr::-webkit-slider-runnable-track{background:linear-gradient(to right,#000,#f00)}
#cg::-webkit-slider-runnable-track{background:linear-gradient(to right,#000,#0f0)}
#cb::-webkit-slider-runnable-track{background:linear-gradient(to right,#000,#00f)}
#cr::-moz-range-track{background:linear-gradient(to right,#000,#f00)}
#cg::-moz-range-track{background:linear-gradient(to right,#000,#0f0)}
#cb::-moz-range-track{background:linear-gradient(to right,#000,#00f)}
.drw{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .32s}
.drw.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease,visibility 0s}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(58vw,340px);min-width:220px;background:var(--card);color:var(--text);padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.8,.3,1);box-shadow:-8px 0 30px rgba(0,0,0,.25);overflow-y:auto}
.drw.show .dpanel{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;margin-bottom:14px}
.dx{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:22px;line-height:1;cursor:pointer;padding:0}
.ditem{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--text);font-size:17px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.ditem svg{flex:none;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.drw,.drw.show,.dpanel{transition-duration:.01s}}
button{-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.22,.8,.3,1),background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,opacity .2s ease,filter .2s ease}
button:active{transform:scale(.93)}
.row{transition:transform .16s cubic-bezier(.22,.8,.3,1),border-color .25s ease,background-color .25s ease}
.row:active{transform:scale(.985)}
.ditem:active{background:rgba(128,128,128,.14)}
.ctl .pp:active{transform:scale(.9)}
input[type=range]::-webkit-slider-thumb{transition:transform .16s ease}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
@media (hover:hover){.btn:hover,.dx:hover,.pp:hover{filter:brightness(1.12)}.tab:hover,.ditem:hover{background-color:rgba(128,128,128,.12)}}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:none}
input[type=range]{touch-action:none}
.bar.full .eq{margin-top:auto}
.bar.full{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.bar.full .in{padding-top:6px}
.bar.full .cover{margin-top:auto}
.btn.up{background:var(--card);color:var(--text);border:2px solid var(--accent);padding:12px 24px;display:block;margin-left:auto;margin-right:auto}
.btn.up:active{background:var(--accent);color:var(--accent-text)}
.dpanel{will-change:transform}
.bar.full{will-change:transform}
@keyframes fsUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fsDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
.bar.full{animation:fsUp .38s cubic-bezier(.22,.8,.3,1)}
.bar.full.closing{animation:fsDown .3s ease-in forwards}
@media (prefers-reduced-motion:reduce){.bar.full,.bar.full.closing{animation-duration:.01s}}
.msg{color:var(--muted);text-align:center;padding:30px 10px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;min-width:0;min-height:48px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:8px 6px;font-size:14px;line-height:1.2;font-weight:600;cursor:pointer}
.tab{display:flex;align-items:center;justify-content:center;text-align:center}
.pages{display:flex;min-height:60vh;min-height:60dvh;overflow:hidden;touch-action:pan-y;margin:0 -16px}
.track{display:flex;flex:none;width:200%;will-change:transform}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 50%;min-width:0;padding:0 16px}
.tab.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.search{display:flex;gap:8px;margin-bottom:12px}
.btn.gear{margin-left:auto;display:flex;align-items:center;justify-content:center;padding:10px 14px}
.btn.ic{display:flex;align-items:center;justify-content:center;padding:10px 14px}
.btn.ic svg{display:block}
.btn.gear svg{display:block}
.search input{flex:1;min-width:0;padding:11px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none}
.search input:focus{border-color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.bar .in{max-width:720px;margin:0 auto}
.bar .now{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px;min-height:22px}
.seek{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.seek input{flex:1;accent-color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:28px;margin:0;--p:0%;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),rgba(128,128,128,.35) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:20px;border-radius:10px;background:#fff;border:0;margin-top:-7.5px;box-shadow:0 2px 6px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(128,128,128,.35)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:30px;height:20px;border-radius:10px;background:#fff;border:0;box-shadow:0 2px 6px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.3)}
.ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:8px}
.ctl .sm{font-size:20px;width:46px;height:46px;border-radius:50%;padding:0;border:1px solid var(--line)}
.ctl .sm.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.ctl .sp{font-size:14px;font-weight:700}
.ctl button svg{display:block;margin:auto}
.spv{font-size:34px;font-weight:700;margin:0 0 12px}
.spm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.ctl button{border:0;background:transparent;color:var(--text);font-size:26px;cursor:pointer;padding:6px 10px}
.ctl .pp{background:var(--accent);color:var(--accent-text);width:54px;height:54px;border-radius:50%;font-size:22px;padding:0}
.cf{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.cf.show{display:flex}
.cf .box{background:var(--card);color:var(--text);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center}
.cf p{margin:0 0 18px;font-size:17px;font-weight:600}
.cf .r{display:flex;gap:10px}
.cf .r .btn{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1><b>Crim</b>Sound</h1>
  <input type="file" id="fileInput" multiple hidden>
  <div class="search"><input id="q" type="text" placeholder="Поиск трека по названию…" autocomplete="off"><button class="btn ghost" id="qClear" hidden>Сброс</button><button class="btn ic" id="qGo" aria-label="Найти"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2L20.5 20.5"/></svg></button><button class="btn gear" id="settingsBtn" aria-label="Настройки"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="3.2"/><g fill="currentColor"><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8"/><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8" transform="rotate(45 12 12)"/><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8" transform="rotate(90 12 12)"/><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8" transform="rotate(135 12 12)"/><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8" transform="rotate(180 12 12)"/><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8" transform="rotate(225 12 12)"/><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8" transform="rotate(270 12 12)"/><rect x="10.4" y="2.4" width="3.2" height="4.2" rx="0.8" transform="rotate(315 12 12)"/></g></svg></button></div>
  <nav class="tabs" id="tabs"></nav>
  <button class="btn up" id="upBtn">+ Загрузить MP3</button>
  <p class="status" id="status"></p>
  <div class="pages" id="pages"><div class="track" id="track"><div class="page" id="list"></div><div class="page" id="list2"></div></div></div>
</div>

<div class="bar" id="bar"><div class="in">
  <button class="fsx" id="fsx" aria-label="Свернуть"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="fslogo"><b>Crim</b>Sound</div>
  <div class="cover" id="cover"><img id="coverImg" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><div class="ph" id="coverPh"><svg viewBox="0 0 200 200" aria-hidden="true"><rect x="83" y="58" width="7" height="80" fill="#fff"/><rect x="143" y="43" width="7" height="80" fill="#fff"/><polygon points="83,58 150,41 150,65 83,82" fill="#fff"/><ellipse cx="72" cy="142" rx="21" ry="15" transform="rotate(-20 72 142)" fill="#fff"/><ellipse cx="132" cy="127" rx="21" ry="15" transform="rotate(-20 132 127)" fill="#fff"/></svg></div></div>
  <canvas class="eq" id="eq"></canvas>
  <div class="now" id="now">Выберите трек</div>
  <div class="seek"><span id="tc">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="td">0:00</span></div>
  <div class="ctl"><button class="sm" id="rep" aria-label="Повтор трека"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button><button id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><rect x="4.5" y="5" width="3" height="14" rx="1"/><polygon points="19,6 19,18 10,12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><button class="pp" id="pp" aria-label="Пуск"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><polygon id="ppA" points="6,4 12,8 12,16 6,20"/><polygon id="ppB" points="12,8 18,12 18,12 12,16"/></svg></button><button id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><rect x="16.5" y="5" width="3" height="14" rx="1"/><polygon points="5,6 5,18 14,12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><button class="sm sp" id="spd" aria-label="Скорость">1×</button></div>
</div></div>

<div class="cf" id="cf"><div class="box"><p>Вы точно уверены, что хотите удалить этот трек?</p><div class="r"><button class="btn ghost" id="cfNo">Нет, отмена</button><button class="btn danger" id="cfYes">Да, удалить</button></div></div></div>
<div class="cf" id="cm"><div class="box"><p>Обложка трека</p><div class="stack"><button class="btn" id="cmChange">Изменить обложку</button><button class="btn ghost dt" id="cmDel">Удалить обложку</button><button class="btn ghost" id="cmNo">Отмена</button></div></div></div>
<input type="file" id="coverInput" accept="image/*" hidden>
<div class="toast" id="toast"></div>
<div class="drw" id="drw"><div class="dpanel"><div class="dh"><span>Настройки</span><button class="dx" id="drwX" aria-label="Закрыть">×</button></div><button class="ditem" id="itTheme"><span>Оформление</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div></div>
<div class="cf" id="st"><div class="box stbox"><p>Оформление</p><div class="sh">Цвет оформления</div><div class="swg" id="swatches"></div><div class="pal"><div class="pv" id="pv"></div><div class="hx" id="hx"></div></div><label class="rl"><span>R</span><input type="range" id="cr" min="0" max="255"></label><label class="rl"><span>G</span><input type="range" id="cg" min="0" max="255"></label><label class="rl"><span>B</span><input type="range" id="cb" min="0" max="255"></label><button class="btn" id="stOk" style="width:100%;margin-top:16px">Закрыть</button></div></div>
<div class="cf" id="sp"><div class="box"><p>Скорость воспроизведения</p><div class="spv" id="spv">1×</div><input type="range" id="spr" min="0.5" max="2" step="0.05" value="1" style="width:100%;accent-color:var(--accent)"><div class="spm"><span>0.5×</span><span>2×</span></div><div class="r" style="margin-top:16px"><button class="btn ghost" id="spReset">Обычная (1×)</button><button class="btn" id="spOk">Готово</button></div></div></div>
<audio id="au" preload="metadata"></audio>

<script>
var $=function(id){return document.getElementById(id)};
var DB=null,tracks=[],cur=-1,pending=null,objUrl=null,memId=0,seeking=false,query="",au=$("au");

function setStatus(t,err){var s=$("status");s.textContent=t||"";s.className="status"+(err?" err":"")}
function fmt(s){if(!isFinite(s))return"0:00";s=Math.floor(s);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
